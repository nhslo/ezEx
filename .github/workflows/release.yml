name: Build and publish ezEx

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate extension
        run: |
          npm run check
          npm test
      - name: Build browser packages
        run: npm run build
      - name: Upload archives as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezEx-browser-packages
          path: dist/releases/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/*.zip --generate-notes --verify-tag
